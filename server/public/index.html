<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rat Catchers</title>
<meta name="description" content="RAT CATCHERS: catch, collect and trade rats with friends. An ORION original.">
<style>html,body{margin:0;height:100%;background:#0d1020;overflow:hidden}#game{position:fixed;inset:0}</style>
</head>
<body>
<div id="game"></div>
<script>
  // When this page comes from the game server itself, play on that server.
  if (location.protocol === 'http:' || location.protocol === 'https:') window.RC_SERVER = location.host;
</script>
<script src="ratcatchers.js"></script>
<script>
  window.game = RATCATCHERS(document.getElementById('game'), { test: /[?&]test=1\b/.test(location.search), noAA: /[?&]noaa=1\b/.test(location.search), captureKeys: true });
</script>
</body>
</html>
